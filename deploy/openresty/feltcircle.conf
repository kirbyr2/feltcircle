# OpenResty example for FeltCircle (Node.js backend on 127.0.0.1:8787).
#
# OpenResty is Nginx with Lua; this file uses only standard Nginx directives,
# plus one optional Lua block that answers health checks without touching the
# backend. Replace YOUR_DOMAIN and the certificate paths, then:
#   sudo cp feltcircle.conf /usr/local/openresty/nginx/conf/conf.d/
#   # make sure nginx.conf has:  include conf.d/*.conf;  inside the http { } block
#   sudo openresty -t && sudo systemctl reload openresty
#
# Layout served here:
#   /                 static web app (apps/web/dist copied to /opt/feltcircle/web)
#   /join/CODE        invite links -> index.html (the app reads the code)
#   /api/*            HTTP API (capabilities, room creation)
#   /ws               WebSocket for live rooms (/ws?room=CODE)

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

upstream feltcircle_backend {
    server 127.0.0.1:8787;
    keepalive 16;
}

server {
    listen 80;
    listen [::]:80;
    server_name YOUR_DOMAIN;
    location /.well-known/acme-challenge/ { root /var/www/html; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name YOUR_DOMAIN;

    ssl_certificate     /etc/letsencrypt/live/YOUR_DOMAIN/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/YOUR_DOMAIN/privkey.pem;

    client_max_body_size 64k;
    root /opt/feltcircle/web;

    # Optional: liveness probe answered by OpenResty itself.
    location = /healthz {
        default_type text/plain;
        content_by_lua_block { ngx.say("ok") }
    }

    # Live rooms (WebSocket). Long timeouts keep idle tables connected.
    location = /ws {
        proxy_pass http://feltcircle_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
        proxy_buffering off;
    }

    # HTTP API (also carries the legacy /api/rooms/CODE/ws WebSocket path).
    location /api/ {
        proxy_pass http://feltcircle_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 1h;
    }

    # The service worker, manifest and runtime config must never be cached.
    location ~ ^/(sw\.js|index\.html|config\.json|manifest\.webmanifest)$ {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    # Hashed build assets can be cached forever.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Everything else: static files, falling back to the app for /join/CODE etc.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
