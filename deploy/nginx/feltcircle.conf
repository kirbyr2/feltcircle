# Nginx / OpenResty reverse proxy for FeltCircle.
# Replace YOUR_DOMAIN and the certificate paths, then:
#   sudo cp feltcircle.conf /etc/nginx/conf.d/   (or sites-available + symlink)
#   sudo nginx -t && sudo systemctl reload nginx
# Certificates: e.g. `sudo certbot --nginx -d YOUR_DOMAIN`.

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

upstream feltcircle {
    server 127.0.0.1:8787;
    keepalive 16;
}

server {
    listen 80;
    listen [::]:80;
    server_name YOUR_DOMAIN;
    location /.well-known/acme-challenge/ { root /var/www/html; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name YOUR_DOMAIN;

    ssl_certificate     /etc/letsencrypt/live/YOUR_DOMAIN/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/YOUR_DOMAIN/privkey.pem;

    client_max_body_size 64k;

    # WebSocket endpoint for rooms: /ws?room=XXXXX
    # (older clients used /api/rooms/XXXXX/ws; both are accepted by the server)
    location ~ ^/(ws|api/rooms/[A-Z0-9]+/ws)$ {
        proxy_pass http://feltcircle;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
        proxy_buffering off;
    }

    # HTTP API and (if STATIC_DIR is set) the web app itself.
    location / {
        proxy_pass http://feltcircle;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Alternative: let Nginx serve the static build and proxy only /api/ and /ws.
    # root /opt/feltcircle/web;
    # location /api/ { proxy_pass http://feltcircle; ...same headers as above... }
    # location / { try_files $uri $uri/ /index.html; }   # also serves /join/CODE invite links
}
